<main class="login-page">
  <section class="login-mobile">
    <form class="login-card" (ngSubmit)="onLogin()">
      <div class="brand-logo">
        <img [src]="imageSrc" [alt]="imageAlt" />
      </div>

      <div class="hero">
        <h1>IVORY</h1>
        <p>Soluções para indústria.</p>
      </div>

      <label class="field">
        <span>Usuário</span>
        <input
          type="text"
          placeholder="Digite seu login"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
          required
        />
      </label>

      <label class="field">
        <span>Senha</span>
        <div class="input-senha">
          <input
            [type]="mostrarSenha ? 'text' : 'password'"
            placeholder="Digite sua senha"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-senha"
            (click)="mostrarSenha = !mostrarSenha"
            aria-label="Alternar visibilidade da senha"
          >
            {{ mostrarSenha ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </label>

      <button class="btn-login" type="submit">Entrar</button>

      <button class="password-recovery" type="button" (click)="forgotPassword.emit()">
        Esqueceu sua senha?
      </button>

      <p class="rodape">Tintas Marfim &copy; {{ ano }}</p>
    </form>
  </section>
</main>
